name: Dev seed

# 더미(테스트용) 직원/게시글을 매일 자동으로 채우는 크론. worker.ts의
# scheduled() 핸들러로도 같은 일을 할 수 있지만, 그건 실제로 배포된
# Cloudflare Worker에서만 동작한다 — 지금은 dev 브랜치에 버그가 많아
# 운영 사이트에 배포하지 않기로 했으므로, 그 대신 npm run dev:seed(순수
# Node 스크립트, Cloudflare/Next.js 런타임과 무관하게 Supabase에 직접
# 접속)를 GitHub Actions에서 직접 돌린다 — 운영 배포를 전혀 건드리지
# 않는다.
#
# 한국시간 오전 9시(UTC 0시)에 돈다. --tenant는 "1test"(주)테스트).
#
# 중요: 아래 NEXT_PUBLIC_SUPABASE_URL/ANON_KEY는 운영 프로젝트
# (bqetemkilbtjjbgywmbp)가 아니라 별도의 dev 전용 Supabase 프로젝트
# (ubfarxeqaiuzizqkszcy)를 가리킨다 — 처음엔 실수로 운영 프로젝트
# 주소를 그대로 썼다가(ci.yml/wrangler.jsonc와 같은 값을 복사), 운영
# 사이트에는 절대 더미데이터를 만들면 안 된다는 지적을 받고 바로잡았다.
# ci.yml의 e2e 잡과 wrangler.jsonc는 실제 배포/운영 사이트 테스트용이라
# 계속 운영 프로젝트를 가리켜야 하므로 건드리지 않는다 — 이 파일만 dev
# 프로젝트 전용.
#
# 사용 전 준비: 이 저장소에 dev 프로젝트의 service_role 키를
# DEV_SUPABASE_SERVICE_ROLE_KEY라는 이름의 레포 시크릿으로 등록해야
# 한다(운영 프로젝트용 SUPABASE_SERVICE_ROLE_KEY와는 다른 프로젝트라
# 재사용 불가). NEXT_PUBLIC_SUPABASE_ANON_KEY는 민감한 값이 아니라
# (클라이언트 JS에 그대로 노출되는 공개 값) ci.yml과 마찬가지로 이
# 파일에 직접 적어둔다.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ubfarxeqaiuzizqkszcy.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViZmFyeGVxYWl1eml6cWtzemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5Mzc4NjQsImV4cCI6MjEwNTUxMzg2NH0.lfDuWUDY8A5R_Yx3HWDVY7sey-_vLrZsxSV3gcG2D8c

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dev seed
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run dev:seed -- --tenant=1test
