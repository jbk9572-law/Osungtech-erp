name: Diagnose inventory balance (temporary, read-only)

# 특정 품목(SKU/품목명)의 재고 캐시·원장 잔량을 운영 DB에서 직접 조회하는
# 일회성 읽기 전용 진단 워크플로우. 아무 것도 쓰지 않는다(select만).
# 진단이 끝나면 이 워크플로우 파일은 삭제한다.

on:
  workflow_dispatch:
    inputs:
      search:
        description: "품목 SKU 또는 품목명 (부분일치)"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query production DB
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y postgresql-client >/dev/null
          echo "=== 매칭 품목 ==="
          psql "$DB_URL" -c "select id, sku, name, spec from products where sku ilike '%${{ inputs.search }}%' or name ilike '%${{ inputs.search }}%';"

          echo "=== 재고 캐시(inventory.quantity, 창고별) ==="
          psql "$DB_URL" -c "
            select p.sku, p.name, w.name as warehouse, inv.quantity as cached
            from inventory inv
            join products p on p.id = inv.product_id
            join warehouses w on w.id = inv.warehouse_id
            where p.sku ilike '%${{ inputs.search }}%' or p.name ilike '%${{ inputs.search }}%';
          "

          # get_product_ledger_rows는 함수 안에서 tenant_id=current_tenant_id()로
          # 필터하는데, 이 psql 세션은 PostgREST/JWT 경유가 아니라 auth.uid()가
          # null이라 current_tenant_id()도 null이 되어 전부 걸러진다 — 같은
          # 계산 로직을 테넌트 필터 없이 그대로 인라인해서 쓴다.
          echo "=== 원장 전체 이력 (거래일자순, 앵커 반영 잔량) ==="
          psql "$DB_URL" -c "
            with target as (
              select id, sku from products
              where sku ilike '%${{ inputs.search }}%' or name ilike '%${{ inputs.search }}%'
            ),
            scope as (
              select tg.sku, t.id, t.warehouse_id, t.type, t.quantity, t.transaction_date, t.created_at,
                t.counted_absolute_quantity, t.reference,
                case when t.type = 'out' then -abs(t.quantity) else t.quantity end as signed_qty
              from inventory_transactions t
              join target tg on tg.id = t.product_id
            ),
            anchored as (
              select *,
                count(counted_absolute_quantity) over (partition by warehouse_id order by transaction_date, created_at) as anchor_group
              from scope
            ),
            grouped as (
              select *,
                coalesce(max(counted_absolute_quantity) over (partition by warehouse_id, anchor_group), 0) as group_base,
                sum(case when counted_absolute_quantity is not null then 0 else signed_qty end)
                  over (partition by warehouse_id, anchor_group order by transaction_date, created_at rows between unbounded preceding and current row)
                  as running_in_group
              from anchored
            )
            select sku, id, warehouse_id, type, quantity, transaction_date, created_at, reference,
              group_base + running_in_group as balance_after_in_that_warehouse
            from grouped
            order by transaction_date, created_at;
          "

          echo "=== 비교용: created_at(입력시각) 순서로 단순 누적했을 때 ==="
          psql "$DB_URL" -c "
            with raw as (
              select p.sku, it.id, it.type, it.quantity, it.transaction_date, it.created_at,
                case when it.type='out' then -abs(it.quantity) else it.quantity end as signed_qty
              from inventory_transactions it
              join products p on p.id = it.product_id
              where p.sku ilike '%${{ inputs.search }}%' or p.name ilike '%${{ inputs.search }}%'
            )
            select sku, id, type, quantity, transaction_date, created_at,
              sum(signed_qty) over (order by created_at rows unbounded preceding) as naive_created_at_balance
            from raw
            order by created_at;
          "
