name: Hourly DB backup

# Supabase Free 플랜에는 자동 백업(Backups) 메뉴 자체가 없다(Pro부터 제공).
# 그래서 이 저장소 자체를 백업 저장소로 써서, 매시간 DB 전체를
# pg_dump로 떠서 db-backups 브랜치에 커밋해둔다. main 브랜치 히스토리와는
# 분리된 별도 브랜치라 평소 클론/배포에는 영향이 없다.
#
# 매시간이라는 주기는 하루 거래량이 적은(매출+매입 합쳐 10건 안팎) 지금
# 규모를 기준으로 정했다 — 매번 DB 전체를 내려받으므로 Supabase 무료
# 트래픽 한도(5GB/월)를 DB 용량 × 실행 횟수만큼 소진한다. 데이터가 크게
# 늘어나면(파일 첨부 등) 주기를 다시 점검해야 한다.
#
# 사용 전 준비 (1회):
#   1. Supabase 대시보드 > Project Settings > Database > Connection string에서
#      반드시 "Session pooler" URI를 복사한다 (IPv4 호환 — GitHub Actions
#      러너가 IPv4라 direct connection은 안 될 수 있다). "Transaction pooler"는
#      쓰지 않는다 — pg_dump가 기대하는 세션 상태를 유지해주지 않아서
#      Supabase 공식 문서도 pg_dump/pg_restore에는 transaction 모드를
#      쓰지 말라고 명시한다. 비밀번호 자리([YOUR-PASSWORD])는 실제 DB
#      비밀번호로 바꿔서 복사한다.
#   2. 이 저장소 Settings > Secrets and variables > Actions에서
#      New repository secret으로 이름 SUPABASE_DB_URL, 값은 위 URI로 등록한다.
#      (절대 이 값을 코드나 채팅에 직접 붙여넣지 않는다 — GitHub Secrets에만 등록)
#   3. 최초 1회는 Actions 탭에서 이 워크플로우를 "Run workflow"로 수동 실행해
#      정상적으로 도는지 확인한다.
#
# 복원 방법은 scripts/restore-db-backup.sh 참고.

on:
  schedule:
    - cron: "0 * * * *" # 매시 정각 (하루 24회) — 하루 거래량이 적어(매출+매입 합쳐 10건 안팎)
                         # GitHub Actions 무료 시간(2,000분/월 중 약 720분만 사용)과
                         # Supabase 무료 트래픽(5GB/월)에 여유가 있어 이 주기로 설정했다.
                         # 데이터가 크게 늘어나면(파일 첨부 등) 이 주기를 다시 점검할 것.
  workflow_dispatch: {}

# 기본 GITHUB_TOKEN은 요즘 조직 설정에 따라 읽기 전용으로 발급되는 경우가
# 많다 — db-backups 브랜치에 커밋을 push하려면 명시적으로 쓰기 권한이
# 필요하다.
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify secret is configured
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL secret이 설정되어 있지 않습니다. 워크플로우 파일 상단 안내를 참고해 등록해주세요."
            exit 1
          fi

      - name: Dump database (via postgres:17 client image, custom format)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          docker run --rm -v "$PWD/backups:/backups" -e PGCONNECT_TIMEOUT=30 postgres:17 \
            pg_dump "$DB_URL" --no-owner --no-privileges --format=custom -f "/backups/${STAMP}.dump"
          echo "DUMP_FILE=backups/${STAMP}.dump" >> "$GITHUB_ENV"

      - name: Switch to db-backups branch (create if missing)
        run: |
          set -euo pipefail
          git config user.name "db-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git stash -u
          if git ls-remote --exit-code --heads origin db-backups >/dev/null 2>&1; then
            git fetch origin db-backups
            git checkout db-backups
          else
            git checkout --orphan db-backups
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git stash pop

      - name: Prune old backups (keep most recent 720 = ~30 days of hourly)
        run: |
          set -euo pipefail
          mkdir -p backups
          cd backups
          ls -1 *.dump 2>/dev/null | sort | head -n -720 | xargs -r rm -f

      - name: Commit and push
        run: |
          set -euo pipefail
          git add backups
          if git diff --cached --quiet; then
            echo "변경된 백업 파일이 없습니다 (덤프 실패 가능성 있음, 위 단계 로그 확인)."
            exit 1
          fi
          git commit -m "DB backup $(date -u +%F)"
          git push origin db-backups
