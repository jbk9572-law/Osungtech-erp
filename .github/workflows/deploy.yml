name: Deploy to production server

# main에 push될 때마다 AWS 라이트세일 서버(서울 리전, docs/self-hosting-aws.md
# 참고)에 최신 버전을 반영한다 — 매번 사람이 직접 터미널 열어서 돌릴 필요가
# 없게 한다. 서버 주소/계정은 비밀값이 아니라 그대로 적어두고, SSH 개인키
# (DEPLOY_SSH_KEY)만 저장소 Secrets에 등록한다.
#
# 예전엔 서버에서 직접 `docker compose up -d --build`로 이미지를 빌드했는데,
# 라이트세일 1GB RAM(+2GB 스왑) 인스턴스에서 Next.js(Turbopack) 프로덕션
# 빌드가 메모리 부족으로 스왑 스래싱에 빠져 "Creating an optimized
# production build..." 단계에서 진행이 거의 안 되는 채로 멈췄다 — 타임아웃을
# 10분→25분으로 늘려봐도 그 안에 안 끝났다(실제 배포 2회 연속 재현, 둘 다
# 같은 지점에서 타임아웃). 그래서 빌드 자체를 메모리가 훨씬 넉넉한 이
# GitHub Actions 러너에서 하고, 다 만들어진 이미지만 서버로 보내 올리기만
# 하도록 바꾼다 — 서버는 더 이상 빌드를 전혀 하지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      # NEXT_PUBLIC_* 값은 브라우저로 그대로 노출되는 값이라 비밀이 아니지만
      # (빌드 시점에 클라이언트 번들에 박히는 값), 그래도 워크플로우 파일에
      # 하드코딩하지 않고 서버에 이미 있는 .env.production에서 그대로
      # 읽어온다 — 값이 바뀌어도(예: Supabase 프로젝트 교체) 이 파일을
      # 또 고칠 필요가 없게.
      - name: 서버의 공개 Supabase 값 읽어오기 (빌드 인자용)
        id: envs
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: 54.180.194.235
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: grep -E '^NEXT_PUBLIC_SUPABASE_(URL|ANON_KEY)=' ~/Osungtech-erp/.env.production
          capture_stdout: true

      - name: 읽어온 값을 이후 스텝의 환경변수로
        run: echo "${{ steps.envs.outputs.stdout }}" >> "$GITHUB_ENV"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # push: false + load: true — 레지스트리에 올리지 않고 이 러너의 로컬
      # 도커 데몬에 바로 적재한다. GitHub Actions 캐시(type=gha)로 레이어를
      # 재사용해 두 번째 배포부터는 더 빨라진다.
      - name: 이미지 빌드 (이 러너에서, 서버가 아니라)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: osungtech-erp-app:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 이미지를 파일로 저장 + 압축
        run: docker save osungtech-erp-app:latest | gzip > app.tar.gz

      - name: 서버로 이미지 전송
        uses: appleboy/scp-action@v1
        with:
          host: 54.180.194.235
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: app.tar.gz
          target: ~/

      # 서버는 이제 이미지를 올리기(docker load)만 하고, 빌드는 전혀 하지
      # 않는다 — docker-compose.yml의 app 서비스에 image: osungtech-erp-app:
      # latest를 명시해뒀으므로, docker compose up -d(--build 없이)가 방금
      # 올린 이 이미지를 그대로 쓴다. git pull은 docker-compose.yml/Caddyfile
      # 등 코드가 아닌 구성 파일 변경을 반영하기 위해 계속 필요하다.
      - name: 서버에서 이미지 적재 + 재기동
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: 54.180.194.235
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            docker load < ~/app.tar.gz
            rm -f ~/app.tar.gz
            cd ~/Osungtech-erp
            git pull
            export $(cat .env.production | xargs)
            docker compose up -d
