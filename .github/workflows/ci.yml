name: CI

# push할 때 타입체크/eslint/자체 검사 스크립트/유닛테스트/빌드를 자동으로
# 돌려서, 깜빡하고 건너뛰는 일이 없게 한다. 이 앱은 전부 동적 렌더링이라
# next build 자체는 Supabase 환경변수 없이도 끝까지 된다. (e2e 잡은 계속
# 실패 상태로 방치돼 신뢰를 깎아서 삭제했다 — 화면 자동 테스트가 필요하면
# 안정적으로 돌릴 수 있게 새로 설계해서 다시 추가한다.)

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bqetemkilbtjjbgywmbp.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZXRlbWtpbGJ0ampiZ3l3bWJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMDkzNzgsImV4cCI6MjA5ODc4NTM3OH0.nUasjmfaisANmU9z_zSoQuVIryOQaZrcrT80a5vwcf0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint (eslint + 자체 검사 스크립트)
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # 샌드박스 테넌트(운영 DB 안의 테스트 전용 회사)로 실제 앱을 띄워 화면과 DB 흐름을
  # 확인하는 e2e. 계정은 GitHub 비밀값(SANDBOX_*)에서만 온다 — 코드/대화에 남기지 않는다.
  # 같은 샌드박스 데이터를 동시에 만지면 서로 결과를 망치므로 실행을 한 줄로 세운다.
  e2e:
    name: E2E (sandbox)
    runs-on: ubuntu-latest
    needs: quality
    concurrency:
      group: e2e-sandbox
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          E2E_EMAIL: ${{ secrets.SANDBOX_EMAIL }}
          E2E_PASSWORD: ${{ secrets.SANDBOX_PASSWORD }}
          E2E_COMPANY: ${{ secrets.SANDBOX_COMPANY_CODE }}
        run: npx playwright test

      - name: Upload Playwright report (실패 시 확인용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # 화면 비교 안전망 — main에 배포된 버전과 이 브랜치를 같은 샌드박스 화면으로 각각 찍어
  # 픽셀을 비교한다. 폼 합치기/스타일 정리처럼 "겉모습은 그대로여야 하는 작업"이 화면을
  # 바꿨는지 기계가 본다. main 자체에서는 비교 대상이 없으므로 건너뛴다. 샌드박스 데이터를
  # 읽기만 하지만 e2e(쓰기)와 겹치면 화면이 달라질 수 있어 같은 줄(concurrency)에 세운다.
  visual:
    name: Visual compare (vs main)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref != 'refs/heads/main'
    concurrency:
      group: e2e-sandbox
      cancel-in-progress: false
    steps:
      - name: Checkout (이 브랜치)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install + build (이 브랜치)
        run: |
          npm ci
          npm run build

      - name: Install + build (기준 - main)
        run: |
          git worktree add ../base origin/main
          cd ../base
          npm ci
          npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Visual compare
        env:
          E2E_EMAIL: ${{ secrets.SANDBOX_EMAIL }}
          E2E_PASSWORD: ${{ secrets.SANDBOX_PASSWORD }}
          E2E_COMPANY: ${{ secrets.SANDBOX_COMPANY_CODE }}
          BASE_DIR: ../base
        run: npx playwright test -c playwright.visual.config.ts

      - name: Upload visual diff report (실패 시 확인용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report-visual/
          retention-days: 14

  # dev(claude/**)에 푸시하면 "예행연습용" DB(elvonix-erp-dev — 실제 서비스는
  # 이 DB를 쓰지 않는다, 가짜 데이터만 있음)에, main에 병합하면 운영 DB
  # (elvonix-erp)에 새 마이그레이션만 자동으로 적용한다. 예행연습 DB를 남겨둔
  # 이유: 잘못된 DB 변경이 운영에 닿기 전에 실제 Supabase에서 먼저 적용해
  # 보는 안전망이다(지우면 운영에 곧바로 닿는다). 이 DB가 일시정지되지 않게
  # supabase-keepalive.yml이 3일마다 핑을 보낸다.
  # 지금까지는 마이그레이션 SQL을 사람이 Supabase SQL Editor에 직접
  # 복붙해왔는데, "어디까지 적용했는지" 기록이 전혀 안 남다 보니 운영
  # DB가 dev보다 69개(약 2개월치)나 뒤처진 걸 뒤늦게 발견한 사고가
  # 있었다 — supabase CLI의 적용 이력 테이블(supabase_migrations.
  # schema_migrations)에 맡기면 "새로 생긴 것만" 알아서 골라 적용되므로
  # 같은 사고가 구조적으로 반복되지 않는다.
  #
  # 사용 전 준비 (1회, 로컬에서):
  #   1. 이미 수동으로 적용해둔 두 DB(elvonix-erp-dev, elvonix-erp)는
  #      CLI 입장에선 "한 번도 기록 안 된" 상태라, 이 워크플로우가 처음
  #      돌면 195개를 전부 새로 적용하려다 "이미 있음" 에러로 실패한다.
  #      그래서 먼저 각 DB에 대해 "여기까지는 이미 적용된 걸로 쳐줘"를
  #      한 번씩 기록해야 한다(로컬 터미널, 이 저장소 폴더에서):
  #        npx supabase login
  #        npx supabase link --project-ref ubfarxeqaiuzizqkszcy   # dev
  #        npx supabase migration repair --status applied $(ls supabase/migrations | sed -E 's/_.*//')
  #        npx supabase link --project-ref bqetemkilbtjjbgywmbp   # production
  #        npx supabase migration repair --status applied $(ls supabase/migrations | sed -E 's/_.*//')
  #   2. 이 저장소 Settings > Secrets and variables > Actions에서
  #      SUPABASE_DB_URL_DEV / SUPABASE_DB_URL_PROD 두 개를 등록한다 —
  #      둘 다 각 Supabase 프로젝트의 Database > Connection string >
  #      "Session pooler" URI(db-backup.yml과 같은 이유로 Transaction
  #      pooler 금지, 비밀번호는 실제 값으로 치환). 절대 코드/채팅에
  #      직접 붙여넣지 않는다 — GitHub Secrets에만 등록한다.
  migrate-db:
    name: Push new DB migrations
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push migrations
        env:
          DB_URL: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_DB_URL_PROD || secrets.SUPABASE_DB_URL_DEV }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::SUPABASE_DB_URL_PROD 시크릿이 설정되어 있지 않습니다. 워크플로우 파일 상단 안내를 참고해 등록해주세요."
            else
              echo "::error::SUPABASE_DB_URL_DEV 시크릿이 설정되어 있지 않습니다. 워크플로우 파일 상단 안내를 참고해 등록해주세요."
            fi
            exit 1
          fi
          npx supabase db push --db-url "$DB_URL" --yes
