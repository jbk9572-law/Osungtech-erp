name: Supabase connection warmup

# 로그인/로그아웃/저장처럼 버튼 클릭마다 따로따로 요청이 뜨는 동작이
# 16-20초씩 걸린다는 제보를 실시간으로 재현해서 확정한 원인: Cloudflare
# Workers가 한동안 요청이 없으면 Supabase로 가는 연결을 닫고, 다음
# 요청에서 처음부터 TCP/TLS를 다시 맺는 비용이 그대로 지연이 된다.
# 게시판처럼 한 요청 안에서 여러 쿼리를 Promise.all로 같이 보내는
# 화면은 이 비용을 한 번만 내서 안 느꼈을 뿐이다.
#
# 처음엔 Cloudflare Cron Trigger(wrangler.jsonc)로 해결하려 했는데
# 효과가 전혀 없었다 — 이 배포 방식(OpenNext/Cloudflare)은 Cron
# Trigger가 실제 사용자 요청과 다른 위치("유휴 장비")에서 돌아서,
# 거기서 데운 연결은 실제 트래픽 경로와 무관했다. 그래서 바깥에서
# 실제 HTTPS 요청으로 앱 자신을 호출하는 방식(mail-sync.yml과 동일
# 패턴)으로 바꿨는데, GitHub Actions의 schedule 트리거 자체가 이
# 저장소에서 "5분마다"를 지키지 못하고 실제로는 몇 시간에 한 번씩만
# 돌고 있던 것으로 확인됐다(GitHub Actions 스케줄은 공식적으로도
# 지연/스킵이 있을 수 있다고 문서화돼 있고, 이 저장소에서는 그 지연이
# 심했다) — 연결을 분 단위로 데워야 하는 이 용도엔 안 맞는 메커니즘
# 이었다.
#
# 그래서 분 단위 정확도가 보장되는 외부 서비스(cron-job.org)로
# 핑 주체를 옮겼다 — 이 워크플로우의 schedule은 제거하고
# workflow_dispatch만 남겨서, 필요할 때 수동으로 돌려 디버깅하는
# 용도로만 쓴다. 실제 1분 핑은 cron-job.org 쪽 설정이 담당한다
# (대시보드에 잡 추가: POST https://<SITE_URL>/api/cron/warmup,
# 헤더 Authorization: Bearer <CRON_SECRET>, 간격 1분).
#
# mail-sync.yml이 이미 쓰고 있는 SITE_URL/CRON_SECRET 시크릿을 그대로
# 재사용한다(수동 디버깅용 호출에만 쓰임).
#
# .github/workflows/supabase-keepalive.yml(3일 간격)과는 막는 문제가
# 다르다 — 그건 Supabase 프로젝트 자체가 일시정지되는 걸 막는 용도고,
# 이건 이 Worker가 Supabase로 가는 연결을 데워두는 용도다. 둘 다 유지.
on:
  workflow_dispatch: {}

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping warmup endpoint
        # -o /dev/null로 본문을 버리면 실패해도 원인을 알 수 없다
        # (실제로 500 에러가 나는데 본문이 안 보여서 원인 파악이 막힌 적
        # 있음) — 응답 본문을 받아서 실패 시에만 출력한다.
        run: |
          http_code=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -D /tmp/warmup-headers.txt \
            "${{ secrets.SITE_URL }}/api/cron/warmup" \
            -o /tmp/warmup-response.json -w "%{http_code}")
          echo "HTTP $http_code"
          echo "응답 헤더:"
          cat /tmp/warmup-headers.txt
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "응답 본문:"
            cat /tmp/warmup-response.json
            exit 1
          fi
