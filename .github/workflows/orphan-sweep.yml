name: Orphan R2 file sweep

# R2에는 올라가 있는데 그걸 가리키던 DB 행(mail_attachments.storage_path 등)이
# 지워져서 더 이상 아무 데서도 참조하지 않는 "고아 파일"을 매일 한 번
# 찾아서 지운다(scripts/sweep-orphan-r2-files.ts, src/lib/r2/sweep-orphans.ts).
# 방금 업로드됐지만 아직 DB insert 전인 파일을 실수로 지우지 않도록
# 24시간 유예 기간을 둔다(스크립트 쪽 기본값).
#
# 사용 전 준비 (1회) — 이 저장소 Settings > Secrets and variables > Actions에:
#   - SUPABASE_SERVICE_ROLE_KEY (이미 다른 워크플로우에서 쓰고 있다면 재사용)
#   - R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET_NAME
#     (Cloudflare 대시보드에서 R2 API 토큰 발급 시 받은 값과 동일)
# NEXT_PUBLIC_SUPABASE_URL은 공개 값이라(클라이언트 JS에 그대로 노출)
# 비밀로 등록할 필요 없이 아래 env에 직접 적어둔다(ci.yml/wrangler.jsonc와 같은
# 운영 프로젝트 주소).
on:
  schedule:
    - cron: "0 18 * * *" # 매일 한국시간 03:00 (UTC 18:00) — 거래가 뜸한 새벽 시간대
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true로 실행하면 삭제 대상만 로그로 보고 실제로 지우지 않습니다."
        required: false
        default: "false"

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bqetemkilbtjjbgywmbp.supabase.co

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run orphan sweep
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run sweep:orphan-r2 -- --dry-run
          else
            npm run sweep:orphan-r2
          fi
