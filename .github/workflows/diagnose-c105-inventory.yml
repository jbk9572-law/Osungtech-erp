name: diagnose-c105-inventory
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query C105 inventory state (read-only)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq && sudo apt-get install -y -qq postgresql-client
          echo "=== 1) C105 product row ==="
          psql "$DB_URL" -c "select id, sku, name, parent_product_id, cost, price from products where sku = 'C105';"

          echo "=== 2) 파생 SKU(C105 모품목 기준) ==="
          psql "$DB_URL" -c "select id, sku, name, parent_product_id from products where parent_product_id = (select id from products where sku='C105');"

          echo "=== 3) inventory 캐시(창고별) ==="
          psql "$DB_URL" -c "select inv.warehouse_id, w.name, inv.quantity, inv.updated_at from inventory inv join warehouses w on w.id = inv.warehouse_id where inv.product_id = (select id from products where sku='C105');"

          echo "=== 4) 원장 기준 정확한 잔량(get_ledger_opening_balance, p_before=infinity) ==="
          psql "$DB_URL" -c "select get_ledger_opening_balance((select id from products where sku='C105'), null, 'infinity'::timestamptz) as true_balance;"

          echo "=== 5) 캐시-원장 불일치 검사(get_inventory_cache_mismatches, C105만 필터) ==="
          psql "$DB_URL" -c "select * from get_inventory_cache_mismatches() where sku = 'C105';"

          echo "=== 6) transaction_date NULL 개수(마이그레이션 205 앵커 적용 여부) ==="
          psql "$DB_URL" -c "select count(*) as total, count(*) filter (where transaction_date is null) as null_transaction_date from inventory_transactions where product_id = (select id from products where sku='C105');"

          echo "=== 7) 최근 거래 10건(거래일자 기준) ==="
          psql "$DB_URL" -c "select type, quantity, counted_absolute_quantity, transaction_date, created_at, reference from inventory_transactions where product_id = (select id from products where sku='C105') order by transaction_date desc, created_at desc limit 10;"

          echo "=== 8) 최근 재고실사(counted_absolute_quantity 있는 행) ==="
          psql "$DB_URL" -c "select transaction_date, counted_absolute_quantity, reference from inventory_transactions where product_id = (select id from products where sku='C105') and counted_absolute_quantity is not null order by transaction_date desc limit 5;"
